name: morphosis
description: "Non-destructive camera RAW editor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  file_picker: ^8.0.0
  image: ^4.2.0
  path: ^1.9.0
  crypto: ^3.0.7
  sqlite3: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Window icon, loaded from the bundle by linux/runner/my_application.cc.
  # Regenerate with: python3 tool/make_icon.py
  assets:
    - assets/icon/
